name: refresh-and-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 */3 * *"   # every 3 days, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Scheduled / manual runs re-scrape; plain pushes just redeploy what is committed.
      - name: Refresh data
        if: github.event_name != 'push'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # optional; raises Hugging Face rate limits
        run: python scripts/update.py

      - name: Commit data changes
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no data changes"; else
            git commit -m "data: refresh from Artificial Analysis ($(date -u +%F))"
            git push
          fi

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets _site/
          mkdir _site/data
          cp data/models.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
