<!doctype html><meta charset="utf-8"><title>ui tests</title>
<pre id="out">running…</pre>
<iframe id="f" src="../index.html?state=%7B%22set%22:%7B%22mode%22:%22all%22%7D%7D" style="width:1300px;height:2400px;border:0"></iframe>
<script>
const out = []; let fail = 0;
const ok = (n, c, x = '') => { out.push((c ? 'PASS ' : 'FAIL ') + n + (c ? '' : '  ' + x)); if (!c) fail++; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
(async () => {
  const f = document.getElementById('f');
  await new Promise(r => f.addEventListener('load', r)); await sleep(800);
  const d = f.contentDocument, w = f.contentWindow;
  ok('no model-load error', !d.querySelector('.empty') || !/Could not load/.test(d.body.innerHTML));
  ok('main chart drew points', d.querySelectorAll('#main .pt').length > 50, d.querySelectorAll('#main .pt').length);
  ok('quadrant drew', d.querySelectorAll('#quad .pt').length > 0, d.querySelectorAll('#quad .pt').length);
  ok('picks rendered', d.querySelectorAll('#picks .pick').length > 0);
  ok('table rows', d.querySelectorAll('#table tbody tr').length > 50);

  // hover first point of main chart
  const svg = d.querySelector('#main svg'), pt = svg.querySelector('.pt circle:last-child');
  const r = pt.getBoundingClientRect();
  const ev = (type, x, y) => svg.dispatchEvent(new w.MouseEvent(type, { clientX: x, clientY: y, bubbles: true }));
  ev('mousemove', r.x + r.width / 2, r.y + r.height / 2);
  const tip = d.querySelector('#main .tip');
  ok('tooltip shows on hover', !tip.hidden && /Intelligence/.test(tip.innerHTML) && /Hugging Face/.test(tip.innerHTML), tip.innerHTML.slice(0, 120));
  ev('click', r.x + r.width / 2, r.y + r.height / 2);
  ok('click pins tooltip', tip.classList.contains('pinned'));
  ev('click', 2, 2); ev('mousemove', 2, 2);
  ok('click empty unpins', !tip.classList.contains('pinned'));

  // lookup-table pills + quadrant dot sizes (initial view is "All")
  ok('lookup models get a tinted pill', d.querySelectorAll('#main svg rect[fill-opacity="0.16"]').length >= 3, d.querySelectorAll('#main svg rect[fill-opacity="0.16"]').length);
  ok('ring point drawn for each pill', d.querySelectorAll('#main .pt circle[stroke-width="2"]').length >= 3);
  const radii = new Set([...d.querySelectorAll('#quad .pt circle:last-child')].map(c => c.getAttribute('r')));
  ok('quadrant dot size varies with intelligence', radii.size > 3, [...radii].join());

  // table links
  const firstRow = d.querySelector('#table tbody tr');
  ok('table rows link to AA and Hugging Face', firstRow.querySelector('td.name a[href^="https://artificialanalysis.ai/models/"]') && [...firstRow.querySelectorAll('td a')].some(x => x.href.startsWith('https://huggingface.co/')), firstRow.innerHTML.slice(0, 160));

  // tooltip: stays while the pointer moves from the dot into it, closes the moment the pointer leaves the safe zone
  {
    const svg = d.querySelector('#main svg'), pt = svg.querySelector('.pt circle:last-child'), r = pt.getBoundingClientRect(), tip = d.querySelector('#main .tip');
    const ev = (el, type, x, y) => el.dispatchEvent(new w.MouseEvent(type, { clientX: x, clientY: y, bubbles: true }));
    const dx = r.x + r.width / 2, dy = r.y + r.height / 2;
    ev(svg, 'mousemove', dx, dy);
    ok('tooltip opens on hover', !tip.hidden);
    const tr = tip.getBoundingClientRect();
    ev(d, 'mousemove', (dx + (tr.left + tr.right) / 2) / 2, dy);   // in the corridor between dot and tooltip
    ok('tooltip stays in the corridor between dot and tooltip', !tip.hidden);
    ev(d, 'mousemove', (tr.left + tr.right) / 2, (tr.top + tr.bottom) / 2);   // over the tooltip itself
    ok('tooltip stays while the pointer is over it', !tip.hidden);
    ev(d, 'mousemove', Math.max(tr.right, dx) + 200, dy);           // well away
    ok('tooltip closes immediately when the pointer moves away', tip.hidden);
  }

  // labels: in the Featured view every dot gets a label, using callouts with leader lines where space is tight
  d.querySelector('#setmode button[data-v="curated"]').click(); await sleep(250);
  {
    const dots = d.querySelectorAll('#main .pt').length - d.querySelectorAll('#main svg rect[fill-opacity="0.16"]').length, labels = d.querySelectorAll('#main .plabel').length;
    ok('Featured view: every dot is labelled', labels === dots, labels + ' labels for ' + dots + ' dots');
    ok('Featured view: callouts use leader lines', d.querySelectorAll('#main .leader').length > 0);
  }

  // hardware: mode pills, total VRAM, FP4
  const readout = () => d.querySelector('.hwsum').textContent;
  const r0 = readout();
  d.querySelector('#pMode .pill[data-v="unified"]').click(); await sleep(150);
  ok('unified mode swaps rows', !!d.querySelector('#pU') && !d.querySelector('#pVram') && readout() !== r0, readout());
  d.querySelector('#pMode .pill[data-v="offload"]').click(); await sleep(150);
  ok('VRAM pills are plain totals from 4 GB, last is 256+', [...d.querySelectorAll('#pVram .pill')].map(b => b.dataset.v).join() === '4,6,8,12,16,24,32,48,64,96,128,192,256' && /256\+ GB/.test(d.querySelector('#pVram').textContent));
  ok('GPU families', [...d.querySelectorAll('#pGpu .pill')].map(b => b.textContent).join('|') === 'RTX 5000 / Blackwell|RTX 2000–4000|GTX|AMD / Intel');
  d.querySelector('#pVram .pill[data-v="96"]').click(); await sleep(150);
  ok('96 GB VRAM shows in summary', /96 GB VRAM/.test(readout()), readout());
  d.querySelector('#pGpu .pill[data-v="rtx50"]').click(); await sleep(150);
  ok('FP4 hardware resolves 4-bit to NVFP4', /NVFP4/.test(d.querySelector('#pPrec').textContent), d.querySelector('#pPrec').textContent);
  d.querySelector('#pGpu .pill[data-v="gtx"]').click(); await sleep(150);
  ok('other GPUs fall back to GGUF', /Q4_K_M/.test(d.querySelector('#pPrec').textContent));

  // model set switch
  const countBefore = d.querySelector('#setcount').textContent;
  d.querySelector('#setmode button[data-v="featured"]').click(); await sleep(200);
  const countAfter = d.querySelector('#setcount').textContent;
  ok('featured set = 12 models', /^12 of/.test(countAfter), countBefore + ' -> ' + countAfter);

  ok('frontier models are added to preset views', /on the frontier/.test(d.querySelector('#setcount').textContent), d.querySelector('#setcount').textContent);

  // granular picker
  d.querySelector('#pickBtn').click(); await sleep(150);
  const panel = d.querySelector('#pickPanel');
  ok('picker opens with a checkbox per model', !panel.hidden && panel.querySelectorAll('input[type=checkbox]').length > 100, panel.querySelectorAll('input').length);
  ok('picker reflects current view', panel.querySelectorAll('input:checked').length === 12);
  const first = panel.querySelector('input:checked'); first.checked = false; first.dispatchEvent(new w.Event('change', { bubbles: true })); await sleep(150);
  ok('unchecking creates a custom set of 11', /11 chosen/.test(d.querySelector('#setcount').textContent) && /Custom \(11\)/.test(d.querySelector('#setmode').textContent), d.querySelector('#setcount').textContent);
  ok('picker pins flagship labs first', [...panel.querySelectorAll('.lab span')].slice(0, 4).map(x => x.textContent).join() === 'Alibaba,Xiaomi,DeepSeek,Z AI', [...panel.querySelectorAll('.lab span')].slice(0, 4).map(x => x.textContent).join());
  panel.querySelector('#pkQ').value = 'qwen'; panel.querySelector('#pkQ').dispatchEvent(new w.Event('input'));
  ok('picker search hides others', [...panel.querySelectorAll('label.it')].filter(l => l.style.display !== 'none').length < 30);
  ok('custom selection does not get extra frontier points', !/frontier/.test(d.querySelector('#setcount').textContent), d.querySelector('#setcount').textContent);
  panel.querySelector('#pkReset').click(); await sleep(150);
  ok('reset returns to the view', /^12 of/.test(d.querySelector('#setcount').textContent) && panel.hidden);

  // x axis toggle, y source toggle
  d.querySelector('#xmode button[data-v="active"]').click(); await sleep(100);
  ok('x title follows toggle', /Active parameters/.test(d.querySelector('#main').textContent));
  // closed models: switch + popover menu + horizontal lines
  const lineCount = () => d.querySelectorAll('#main svg line[stroke-dasharray="7 5"]').length;
  ok('closed models start off: no lines, menu button present but disabled', lineCount() === 0 && d.querySelector('#propMenuBtn').disabled && d.querySelector('#propOn').getAttribute('aria-checked') === 'false');
  const geom = () => ['#chart h2', '#xmode', '#xscale', '#propbox', '#propOn', '#propMenuBtn', '#main'].map(q => { const r = d.querySelector(q).getBoundingClientRect(); return [q, r.left, r.top, r.width, r.height]; });
  const before = geom();
  d.querySelector('#propOn').click(); await sleep(200);
  const after = geom();
  const moved = before.map((b, i) => [b[0], ...[1, 2, 3, 4].map(k => Math.abs(b[k] - after[i][k]))]).filter(x => x.slice(1).some(v => v > 0.5) && x[0] !== '#main');
  ok('toggling closed models moves or resizes nothing else', moved.length === 0, JSON.stringify(moved));
  ok('switch turns on and draws the default 5 tiers', d.querySelector('#propOn').getAttribute('aria-checked') === 'true' && lineCount() === 5 && /5 models/.test(d.querySelector('#propMenuBtn').textContent), lineCount() + ' lines');
  ok('tier menu starts closed', d.querySelector('#propMenu').hidden);
  d.querySelector('#propMenuBtn').click(); await sleep(150);
  const tiers = d.querySelectorAll('#propMenu .tier');
  ok('menu lists every tier and marks the 5 defaults', !d.querySelector('#propMenu').hidden && tiers.length >= 10 && [...tiers].filter(x => x.getAttribute('aria-pressed') === 'true').length === 5, tiers.length + ' tiers');
  const off = [...tiers].find(x => x.getAttribute('aria-pressed') === 'false'); off.click(); await sleep(150);
  ok('picking a tier adds its line and keeps the menu open', lineCount() === 6 && !d.querySelector('#propMenu').hidden && /6 models/.test(d.querySelector('#propMenuBtn').textContent), lineCount() + ' lines, hidden=' + d.querySelector('#propMenu').hidden + ', btn=' + d.querySelector('#propMenuBtn').textContent);
  d.querySelector('#propDefaults').click(); await sleep(150);
  ok('Defaults restores the 5 flagship tiers', lineCount() === 5);
  d.querySelector('#propNone').click(); await sleep(150);
  ok('None clears every line', lineCount() === 0);
  d.body.click(); await sleep(100);
  ok('clicking elsewhere closes the menu', d.querySelector('#propMenu').hidden);
  d.querySelector('#propOn').click(); await sleep(150);
  ok('switch off disables the menu button and keeps its size', d.querySelector('#propMenuBtn').disabled && d.querySelector('#propOn').getAttribute('aria-checked') === 'false');
  ok('no tok/s anywhere in tables or picks', !/tok\/s/.test(d.querySelector('#table').textContent + d.querySelector('#picks').textContent));

  // theme toggle
  const t0 = d.documentElement.dataset.theme; d.querySelector('#theme').click(); await sleep(100);
  ok('theme toggles', d.documentElement.dataset.theme && d.documentElement.dataset.theme !== t0);

  // table sort
  d.querySelector('#table th[data-k="total"]').click(); await sleep(50);
  const firstTotals = [...d.querySelectorAll('#table tbody tr td:nth-child(4)')].slice(0, 2).map(x => x.textContent);
  ok('table sorts by total', d.querySelector('#table th[data-k="total"]').getAttribute('aria-sort') === 'descending', firstTotals.join());
  document.getElementById('out').textContent = (fail ? 'FAILED ' + fail : 'ALL PASSED') + '\n' + out.join('\n');
})().catch(e => { document.getElementById('out').textContent = 'ERROR ' + e.stack; });
</script>
